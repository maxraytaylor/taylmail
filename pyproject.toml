[project]
name = "taylmail"
version = "0.1.0"
description = "Talk to a Claude Code agent over email and Open WebUI chat: patch series out, replies in."
requires-python = ">=3.11"
dependencies = ["claude-agent-sdk>=0.2.163", "fastapi>=0.110", "uvicorn>=0.30"]

[project.scripts]
taylmail = "taylmail.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
